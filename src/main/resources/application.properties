spring.application.name=retail-flow-backend

# MySQL Database Connection (Local Dev Fallbacks)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/retail_flow_dev?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:rohit@123}

# HikariCP Connection Pool Tuning
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:15}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# Hibernate / JPA Settings
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

# Server & Graceful Shutdown
server.port=${PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# CORS & Auth Rate Limiting
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
app.security.auth-rate-limit-per-minute=${AUTH_RATE_LIMIT_PER_MIN:20}

# JWT Security Properties
app.jwt.secret=${JWT_SECRET:YourSuperSecretKeyForRetailFlowBackendJwtAuthenticationWithEnoughLengthForHS512AlgorithmSecureKey}
app.jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# Default Admin Bootstrap
app.admin.default-email=${ADMIN_EMAIL:admin@retailflow.com}
app.admin.default-password=${ADMIN_PASSWORD:admin123}

# Actuator Health Probes
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true
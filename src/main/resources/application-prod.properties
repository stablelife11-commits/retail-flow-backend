# ===================================================================
# STRICT PRODUCTION PROFILE (Activate via SPRING_PROFILES_ACTIVE=prod)
# No fallback secrets are permitted in this file.
# ===================================================================

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:15}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# Default to 'validate' or 'update' via environment variable in production
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Mandatory Externalized Secrets (Fails fast on startup if missing)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION_MS:86400000}

app.admin.default-email=${ADMIN_EMAIL}
app.admin.default-password=${ADMIN_PASSWORD}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.security.auth-rate-limit-per-minute=${AUTH_RATE_LIMIT_PER_MIN:15}

# Disable Swagger UI in production unless explicitly enabled
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

# Logging
logging.level.root=WARN
logging.level.com.retail.flow=INFO